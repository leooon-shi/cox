name: CI

# Build and test Cox across compilers and build types.
#
# DESIGN NOTE: this file deliberately contains NO build knowledge. All
# compiler/flag/sanitizer configuration lives in CMakePresets.json, so the exact
# same commands run locally:
#
#     cmake --preset clang-debug && cmake --build --preset clang-debug \
#       && ctest --preset clang-debug
#
# That keeps CI reproducible on a developer machine and keeps the choice of CI
# system replaceable (a Jenkinsfile would invoke the same three commands).

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    strategy:
      # Don't cancel the other configurations when one fails -- the whole point
      # of the matrix is seeing which configurations are affected.
      fail-fast: false
      matrix:
        preset: [clang-debug, clang-release, gcc-debug, gcc-release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # googletest is a submodule
      - name: Install dependencies
        run: |
          sudo apt-get update
          # libssl-dev: TLS/OCSP.  libc-ares-dev: enables the async DNS backend
          # (COX_HAVE_CARES), so CI exercises CaresResolver too rather than only
          # the ThreadPool fallback.
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang g++ libssl-dev libc-ares-dev openssl

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-logs-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/
          retention-days: 7
  examples:
    name: examples + benchmarks build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libssl-dev libc-ares-dev openssl
      # Examples are excluded from the default build, so they can rot silently.
      # Compiling them here keeps them honest without running the benchmarks
      # (whose numbers are meaningless on a shared CI runner anyway).
      - name: Build examples
        run: |
          cmake --preset examples
          cmake --build --preset examples --parallel

  format:
    name: clang-format check
    runs-on: ubuntu-24.04
    # NON-BLOCKING: the existing code does NOT yet conform to .clang-format
    # (measured 2026-09-05 with clang-format 18: ~3800 replacements across 151
    # files, mostly hand-aligned columns and >80-char lines being reflowed).
    # Bringing it into conformance is a single mechanical commit that touches
    # nearly every file, so it is left as a deliberate decision rather than
    # bundled into unrelated work. This job reports the diff meanwhile; drop
    # continue-on-error once the tree is formatted.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-format
      - name: Check formatting
        run: |
          # Only Cox's own sources; all vendored code lives under third_party/
          # (each dependency has its own style) and is excluded.
          files=$(git ls-files '*.cc' '*.h' \
            | grep -v '^third_party/')
          echo "checking $(echo "$files" | wc -l) files"
          clang-format --dry-run --Werror $files

  clang-tidy:
    name: clang-tidy (braces)
    runs-on: ubuntu-24.04
    # BLOCKING: enforces readability-braces-around-statements (braces on every
    # if/else/loop body) to kill the "goto fail" class of bug. A new brace-less
    # body is a regression and fails the build. Config and rationale live in
    # .clang-tidy; this job holds no analysis knowledge, only how to invoke it.
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang clang-tidy libssl-dev libc-ares-dev openssl
      - name: Configure (generates compile_commands.json)
        # The 'examples' preset builds the library, tests AND examples, so its
        # compile database covers all first-party code in one place -- examples
        # are first-party and must be linted too.
        run: cmake --preset examples
      - name: Run clang-tidy
        run: |
          # Lint only files the compile database actually contains. Driving the
          # list from compile_commands.json (not `git ls-files`) excludes
          # platform-specific sources such as kqueue_poller.cc (macOS/BSD), which
          # would otherwise produce spurious "file not found" errors. Vendored
          # code under third_party/ is filtered out; everything else first-party
          # (library + tests + examples) is checked.
          files=$(sed -n 's/.*"file": "\(.*\)".*/\1/p' \
                    build/examples/compile_commands.json \
                  | grep -v /third_party/ | sort -u)
          echo "checking $(echo "$files" | wc -l) files"
          clang-tidy -p build/examples $files
  sanitizers:
    name: ${{ matrix.preset }}
    runs-on: ubuntu-24.04
    # BLOCKING: ASan/LSan, TSan and UBSan are all clean as of 2026-09-05 (177/177
    # each), so any new finding is a regression and should fail the build. The
    # backlog these were originally added to observe -- an EventLoop wakeup-fd
    # race, a Connector use-after-free, and four shared_ptr reference cycles --
    # has been fixed (See insights/roadmap.md, CI/CD item 3).
    strategy:
      fail-fast: false
      matrix:
        preset: [asan, tsan, ubsan]

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build clang libssl-dev libc-ares-dev openssl
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
      - name: Upload sanitizer logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanitizer-logs-${{ matrix.preset }}
          path: build/${{ matrix.preset }}/Testing/
          retention-days: 7
